name: T noenv
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - probe/family-sign
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Restore cached login token (read only)
        uses: actions/cache/restore@v4
        with:
          path: .token
          key: probe-token-${{ github.run_id }}
          restore-keys: cloud189-token-

      - name: Load secrets into .env
        uses: shine1594/secrets-to-env-action@master
        with:
          secrets: ${{ toJSON(secrets) }}
          secrets_env: production
          prefix_prod: ""
          file_name_prod: .env

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Probe family sign-in
        run: node probe.js
